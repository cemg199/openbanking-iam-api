services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    ports:
      - "8080:8080"

    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

    command:
      - start-dev
      - --import-realm

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/OpenBanking/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    container_name: openbanking-api

    environment:
      KEYCLOAK_SERVER: http://keycloak:8080
      REALM: OpenBanking
      CLIENT_ID: bank-api

    ports:
      - "8000:8000"

    depends_on:
      keycloak:
        condition: service_healthy